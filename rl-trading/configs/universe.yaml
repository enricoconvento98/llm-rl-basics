# Asset universe (HANDOFF §10, decided by Enrico on 2026-10-31):
#   - base currency EUR: values, returns and risk limits are measured in EUR
#   - research listing: US ETF with a long history, used for training and backtests
#   - trading listing: UCITS equivalent that an EU retail account can actually buy (PRIIPs/KID)
# Plus cash (implicit: whatever the weights leave over).
#
# Trading listings are identified by ISIN. Tickers and Yahoo symbols are verified against
# Yahoo's symbol search by `make data-verify` before any data is downloaded.
base_currency: EUR
start_date: 2005-01-01   # GLD, the youngest research ETF, started in November 2004
end_date: null

fx:
  - currency: USD
    data_symbols: {yahoo: "EURUSD=X"}   # USD per 1 EUR

assets:
  - id: us_equity
    name: US large-cap equity (S&P 500)
    asset_class: equity
    research: {symbol: SPY, exchange: ARCA, currency: USD, calendar: XNYS, data_symbols: {yahoo: SPY}}
    trading:
      {symbol: SXR8, exchange: IBIS, currency: EUR, calendar: XETR, isin: IE00B5BMR087,
       data_symbols: {yahoo: SXR8.DE}}   # iShares Core S&P 500 UCITS ETF (Acc)

  - id: eu_equity
    name: European equity
    asset_class: equity
    research: {symbol: VGK, exchange: ARCA, currency: USD, calendar: XNYS, data_symbols: {yahoo: VGK}}
    trading:
      {symbol: EUNK, exchange: IBIS, currency: EUR, calendar: XETR, isin: IE00B4K48X80,
       data_symbols: {yahoo: EUNK.DE}}   # iShares Core MSCI Europe UCITS ETF EUR (Acc); SXR7 is MSCI EMU

  - id: us_treasury_7_10
    name: US Treasuries 7-10 years
    asset_class: bond
    research: {symbol: IEF, exchange: NASDAQ, currency: USD, calendar: XNYS, data_symbols: {yahoo: IEF}}
    trading:
      {symbol: SXRM, exchange: IBIS, currency: USD, calendar: XETR, isin: IE00B3VWN518,
       data_symbols: {yahoo: SXRM.DE}}   # iShares $ Treasury Bond 7-10yr UCITS ETF (Acc)
    # shortcut: Yahoo quotes SXRM.DE in USD (decided 2026-10-31); recheck the trading currency with IBKR in Phase 7

  - id: us_treasury_20_plus
    name: US Treasuries 20+ years
    asset_class: bond
    research: {symbol: TLT, exchange: NASDAQ, currency: USD, calendar: XNYS, data_symbols: {yahoo: TLT}}
    trading:
      {symbol: IS04, exchange: IBIS, currency: EUR, calendar: XETR, isin: IE00BSKRJZ44,
       data_symbols: {yahoo: IS04.DE}}   # iShares $ Treasury Bond 20+yr UCITS ETF (Dist)

  - id: gold
    name: Gold
    asset_class: commodity
    research: {symbol: GLD, exchange: ARCA, currency: USD, calendar: XNYS, data_symbols: {yahoo: GLD}}
    trading:
      {symbol: 4GLD, exchange: IBIS, currency: EUR, calendar: XETR, isin: DE000A0S9GB0,
       data_symbols: {yahoo: 4GLD.DE}}   # Xetra-Gold (ETC, physically backed)
