# Hooks run the project's own pinned tools through uv, so versions always match uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-env-file
        name: never commit .env
        entry: .env files hold credentials and must not be committed
        language: fail
        files: (^|/)\.env$
