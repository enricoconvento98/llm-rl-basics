# Cost model used by every simulation (HANDOFF §2.3: costs everywhere).
# Commission per order = clip(per_share * qty + pct_of_notional * notional, min_per_order, max_pct_of_notional * notional)
# Defaults follow IBKR's fixed pricing for US stocks/ETFs (USD 0.005/share, min USD 1, max 1% of trade value).
# TODO(phase 2): re-check against IBKR's current price list before reporting results.
commission:
  per_share: 0.005
  pct_of_notional: 0.0
  min_per_order: 1.0
  max_pct_of_notional: 0.01
half_spread_bps: 1.0   # used when no bid/ask quotes are available; liquid ETFs are ~1-2 bps wide
slippage_bps: 2.0      # extra adverse move per fill, on top of the spread
