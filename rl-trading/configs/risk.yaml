# PLACEHOLDER limits: the real values are an open decision for Enrico (HANDOFF §10).
# One file on purpose: the same limits apply in every run mode (HANDOFF §6).
# Allowed symbols = the universe in universe.yaml.
max_weight_per_asset: 0.40
max_order_notional: 5000.0      # in base currency
max_daily_turnover: 0.50        # sum of |trade notional| / portfolio value
max_orders_per_day: 50
market_hours_only: true
kill_switch:
  max_drawdown: 0.15            # stop trading at a 15% drawdown from peak equity
  flag_file: /tmp/rltrading.kill  # create this file to stop trading
  env_var: RLTRADING_KILL       # or set this env var
