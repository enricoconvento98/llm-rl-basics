# Postgres (trading logs + MLflow metadata) and the MLflow tracking server.
# Run from the repo root:  make up   (= docker compose -f docker/docker-compose.yml --env-file .env up -d)
#
# Ports bind to 127.0.0.1 only. Exposing them (host, Traefik routing) is an open decision (HANDOFF §10).
# ib-gateway and agent-service are added in Phase 7.

name: rltrading

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rltrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rltrading
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d rltrading && psql -U $${POSTGRES_USER} -d mlflow -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    build: ./mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-rltrading}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      - --host=0.0.0.0
      - --port=5000
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  mlflow-artifacts:
